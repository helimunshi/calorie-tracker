<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calorie Ledger" />
    <meta name="description" content="A simple, private daily calorie ledger." />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <title>Calorie Ledger</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="date-nav" aria-label="Date navigation">
        <button class="icon-button" id="previous-day" type="button" aria-label="Previous day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <button class="date-button" id="date-button" type="button" aria-label="Choose date">
          <span id="date-label">Today</span>
          <input id="date-picker" type="date" tabindex="-1" aria-hidden="true" />
        </button>
        <button class="icon-button" id="next-day" type="button" aria-label="Next day">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
        </button>
      </header>

      <main>
        <section class="summary-card" aria-labelledby="total-heading">
          <h1 class="total" id="daily-total">0</h1>
          <p class="total-caption" id="total-heading">calories today</p>
          <p class="goal-status" id="goal-status" aria-live="polite">2,000 calories under goal</p>
          <button class="goal-row" id="edit-goal" type="button" aria-label="Edit daily calorie goal">
            <span>Daily goal</span>
            <span class="goal-value"><strong id="daily-goal">2,000 cal</strong>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.55 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.2 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4h-.1v-4h.1A1.7 1.7 0 0 0 4.2 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8.6 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.8h4v.1A1.7 1.7 0 0 0 15.6 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 20 8.4a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4h.1v4h-.1A1.7 1.7 0 0 0 20 15Z"/></svg>
            </span>
          </button>
        </section>

        <section class="entries-section" aria-labelledby="entries-heading">
          <h2 class="visually-hidden" id="entries-heading">Entries</h2>
          <div class="empty-state" id="empty-state">
            <p>No entries for this day.</p>
            <p>Tap "+ Add Entry" to get started.</p>
          </div>
          <ul class="entry-list" id="entry-list"></ul>
        </section>
      </main>

      <div class="bottom-action">
        <button class="primary-button add-button" id="add-entry" type="button"><span aria-hidden="true">+</span> Add Entry</button>
      </div>
    </div>

    <div class="sheet-layer" id="goal-sheet" hidden>
      <button class="backdrop" type="button" data-close-sheet aria-label="Close dialog"></button>
      <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="goal-sheet-title">
        <div class="drag-handle" aria-hidden="true"></div>
        <button class="sheet-close" type="button" data-close-sheet aria-label="Close"><span aria-hidden="true">×</span></button>
        <h2 id="goal-sheet-title">Daily calorie goal</h2>
        <form id="goal-form">
          <label for="goal-input">Calories per day</label>
          <input id="goal-input" name="goal" type="number" min="1" step="1" inputmode="numeric" required />
          <button class="primary-button" type="submit">Save goal</button>
          <button class="secondary-button" type="button" data-close-sheet>Cancel</button>
        </form>
      </section>
    </div>

    <div class="sheet-layer" id="entry-sheet" hidden>
      <button class="backdrop" type="button" data-close-sheet aria-label="Close dialog"></button>
      <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="entry-sheet-title">
        <div class="drag-handle" aria-hidden="true"></div>
        <button class="sheet-close" type="button" data-close-sheet aria-label="Close"><span aria-hidden="true">×</span></button>
        <h2 id="entry-sheet-title">Add Entry</h2>
        <form id="entry-form">
          <input id="entry-id" type="hidden" />
          <label for="item-name">Item name</label>
          <input id="item-name" name="name" type="text" placeholder="e.g. Lunch, Exercise" autocomplete="off" maxlength="80" required />
          <label for="calories">Calories</label>
          <input id="calories" name="calories" type="number" placeholder="e.g. 650 or -200" step="1" inputmode="numeric" required />
          <p class="helper-text">Use a negative number for calorie-burning activities like exercise.</p>
          <button class="primary-button" id="entry-submit" type="submit">Add entry</button>
          <button class="secondary-button" type="button" data-close-sheet>Cancel</button>
        </form>
      </section>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
